# A reverse proxy in front terminates TLS and forwards HTTP here with
# X-Forwarded-Proto: https. Prefer that over nginx's own $scheme (always
# "http" on this listener) so the API builds correct absolute URLs for
# SQLAdmin CSS/JS — otherwise browsers block them as mixed content.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# Docker embedded DNS. Variable proxy_pass defers resolve so preview deploys
# that rename services work when the API service is named api-pr-N (not plain "api").
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;

  # Static files only: the API compresses its own responses, and SSE must not
  # be buffered. gzip_proxied: a reverse proxy in front may add a Via header.
  gzip_proxied any;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_types application/javascript text/css application/json image/svg+xml application/wasm application/manifest+json;

  location /api/ {
    set $api_upstream ${API_HOST};
    proxy_pass http://$api_upstream:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Agent Hub (fork): the hub's GUI and API under the same origin. /hub (no slash)
  # stays the SPA route that embeds it; without this exact match nginx would
  # redirect /hub to /hub/ because of the proxied prefix location below.
  location = /hub {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location /hub/ {
    set $hub_upstream ${HUB_HOST};
    rewrite ^/hub/(.*)$ /$1 break;
    proxy_pass http://$hub_upstream:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 30m;
  }

  location /admin {
    set $api_upstream ${API_HOST};
    proxy_pass http://$api_upstream:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /health {
    set $api_upstream ${API_HOST};
    proxy_pass http://$api_upstream:8080/health;
  }

  # Vite content-hashes everything under /assets/, so cache those forever and
  # force revalidation on everything else (index.html above all) — otherwise
  # browsers heuristically cache index.html and keep loading the previous
  # deploy's bundles in new tabs.
  location /assets/ {
    gzip on;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    gzip on;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
