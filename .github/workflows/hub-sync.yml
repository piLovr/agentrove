# Agent Hub fork: once a week, check for a new upstream release and propose it
# as a pull request into `hub` (merge, not rebase, so the PR stays reviewable).
# Nothing is deployed automatically: the NAS keeps its pinned tag until you merge
# and bump AGENTROVE_TAG.
name: hub-sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hub
          fetch-depth: 0
      - name: Find latest upstream release
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/Mng-dev-ai/agentrove/releases/latest --jq .tag_name)
          current=$(cat HUB_UPSTREAM_VERSION)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then echo "up_to_date=true" >> "$GITHUB_OUTPUT"; fi
      - name: Merge upstream release into a sync branch
        if: steps.up.outputs.up_to_date != 'true'
        id: merge
        env:
          LATEST: ${{ steps.up.outputs.latest }}
        run: |
          git config user.name "hub-sync"
          git config user.email "hub-sync@users.noreply.github.com"
          git remote add upstream https://github.com/Mng-dev-ai/agentrove.git
          git fetch upstream "refs/tags/$LATEST:refs/tags/$LATEST" --no-tags
          branch="sync/$LATEST"
          git switch -c "$branch"
          if git merge --no-edit "$LATEST"; then
            echo "$LATEST" > HUB_UPSTREAM_VERSION
            git commit -am "Bump upstream to $LATEST"
            git push -f origin "$branch"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open pull request
        if: steps.merge.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.up.outputs.latest }}
          CURRENT: ${{ steps.up.outputs.current }}
        run: |
          gh pr view "sync/$LATEST" >/dev/null 2>&1 || gh pr create --base hub --head "sync/$LATEST" \
            --title "Update Agentrove $CURRENT → $LATEST" \
            --body "Upstream release: https://github.com/Mng-dev-ai/agentrove/releases/tag/$LATEST

          Merged cleanly into the hub patches. Before merging: build the images, run the stack and check the hub tab, usage badge, mic button and job status line. After merging, set AGENTROVE_TAG=$LATEST-hub on the NAS."
      - name: Report conflicts
        if: steps.merge.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.up.outputs.latest }}
        run: |
          title="Upstream $LATEST conflicts with the hub patches"
          gh issue list --search "$title in:title" --state open --json number --jq length | grep -q '^0$' || exit 0
          gh issue create --title "$title" --body "Merging $LATEST into \`hub\` conflicts in:

          $(sed 's/^/- /' conflicts.txt)

          Resolve locally: \`git fetch upstream --tags && git switch -c sync/$LATEST hub && git merge $LATEST\`."
