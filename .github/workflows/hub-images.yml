# Agent Hub fork: build the slim backend and the patched frontend for the NAS.
name: hub-images

on:
  push:
    branches: [hub]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: agentrove-api
            context: .
            file: backend/Dockerfile.slim
          - name: agentrove-web
            context: frontend
            file: frontend/Dockerfile.production
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "upstream=$(cat HUB_UPSTREAM_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.version.outputs.upstream }}-hub
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:hub-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
